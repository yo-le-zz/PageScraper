[project]
name = "pagescrapper"
version = "1.0.0"
description = "Extracteur web haute fidélité basé sur Chromium, capable de récupérer HTML, CSS, JavaScript et assets."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.55.0",
    "typer>=0.16.0",
]

[project.scripts]
pascra = "PageScrapper.main:app"

[dependency-groups]
dev = [
    "nuitka>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/PageScrapper"]